<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge Intelligence | Martín</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#171717;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(100deg,#b80015,#f00016);color:white;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:18px}header small{display:block;font-size:11px}select,button,input{font:inherit;border-radius:10px;border:1px solid #ddd;padding:11px;background:white}button{cursor:pointer}button.primary{background:#e00018;color:white;border:0;font-weight:700}nav{display:flex;overflow:auto;background:#222;color:white;gap:4px;padding:8px}nav button{flex-shrink:0;background:transparent;border:0;color:white;font-size:13px;padding:10px}nav button.active{background:#ffcf17;color:#161616;font-weight:800}main{max-width:1100px;margin:auto;padding:16px 14px 100px}h1{font-size:25px;margin:4px 0 8px}h2{font-size:18px}p{color:#5a5a60}.kpis,.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid #e7e7eb;border-radius:16px;padding:15px;box-shadow:0 2px 8px #1111;margin-bottom:12px}.kpis .card{margin:0}.big{font-size:25px;font-weight:800;margin:6px 0}.muted{color:#73737b;font-size:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.tag{font-size:12px;padding:5px 9px;border-radius:20px;background:#fff1b6;color:#5e4800}.red{background:#ffe2e6;color:#b80015}.green{background:#d9f7e2;color:#14682c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px}.map{height:260px;border-radius:14px;position:relative;overflow:hidden;background:repeating-linear-gradient(18deg,transparent 0 31px,#e1e6e4 32px 34px,transparent 35px 68px),repeating-linear-gradient(106deg,#eff3ec 0 41px,#dfe9e6 42px 44px,#eff3ec 45px 83px)}.pin{position:absolute;border-radius:100%;border:3px solid white;width:27px;height:27px;background:#1cba55;box-shadow:0 2px 8px #0004}.pin.yellow{background:#f6c423}.pin.red{background:#e50026}.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}.foot button{font-size:11px;border:0;padding:8px}.note{background:#fff8d4;padding:10px;border-radius:10px;font-size:12px;margin:12px 0}.full{width:100%}@media(min-width:750px){.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.4fr 1fr}main{padding:26px}.foot{display:none}h1{font-size:34px}}
</style></head><body><header><div><strong>◆ MARTÍN</strong><small>REPRESENTACIONES · CHALLENGE INTELLIGENCE</small></div><select id="role" onchange="draw()" aria-label="Perfil"><option>Gerencia</option><option>Administración</option><option>Líder de ventas</option><option>Vendedor</option><option>Depósito</option><option>Repartidor</option></select></header><nav id="nav"></nav><main id="app"></main><div class="foot"><button onclick="page='Panel';draw()">⌂ Inicio</button><button onclick="page='Mapa';draw()">⌖ Mapa</button><button onclick="page='Clientes';draw()">▣ Clientes</button><button onclick="page='Pedidos';draw()">▤ Pedidos</button><button onclick="page='Entregas';draw()">🚚 Entregas</button></div><script>
let page='Panel', gps='Puntual', visits=4, discount=0, order=0, status='Registrado', delivered=0, note='',channel='Todos',state='Todos';
const pages=['Panel','Mapa','Clientes','Agenda','Rutas','Equipo','Pedidos','Depósito','Entregas','Cobranzas','Asistente IA','Configuración'];
const clients=[{n:'Restaurante Los Olivos',c:'Gastronómico',s:'Rojo',mix:'Compra fiambre, no compra manteca'},{n:'Almacén La Esquina',c:'Almacenero',s:'Verde',mix:'Compra mortadela, oportunidad en queso'},{n:'Autoservicio Central',c:'Almacenero',s:'Amarillo',mix:'Sin compra reciente de lácteos'},{n:'Parrilla El Encuentro',c:'Gastronómico',s:'Verde',mix:'Compra queso, no compra manteca'}];
const card=(a,b,c='')=>'<div class="card"><div class="muted">'+a+'</div><div class="big">'+b+'</div><div class="muted">'+c+'</div></div>';
const btn=(label,fn,cls='')=>'<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>';
function change(p){page=p;draw()}function kpis(){return '<div class="kpis">'+card('Ventas del período','$48,6 M','↑ 8,4% · Demo')+card('Clientes activos','1.284','↑ 32 · Demo')+card('Visitas registradas',visits,'Objetivo semanal: 85%')+card('Cartera vencida','$3,82 M','24 cuentas · Demo')+'</div>'}
function draw(){document.getElementById('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="change(\''+p+'\')">'+p+'</button>').join('');let h='<div class="muted">Martín Representaciones / '+page+' · '+document.getElementById('role').value+'</div><h1>'+({Panel:'Inteligencia para gestionar mejor.',Mapa:'Mapa comercial',Clientes:'Negocios y clientes',Pedidos:'Seguimiento de pedidos',Entregas:'Logística y entregas'}[page]||page)+'</h1><div class="note">DEMO INTERACTIVA · Datos ficticios. No conectada a AdministraNET, GPS ni IA real.</div>';
if(page==='Panel'){h+=kpis()+'<div class="two"><div class="card"><h2>Alertas que requieren atención</h2>'+['🔴 24 cuentas vencidas','🟡 18 clientes sin visita reciente','🟡 35 clientes con mix reducido','🟢 4 zonas planificadas'].map(t=>'<div class="line">'+t+'</div>').join('')+'</div><div class="card"><h2>Próximas prioridades</h2>'+clients.slice(0,3).map(c=>'<div class="line">'+c.n+' <span class="tag">'+c.s+'</span></div>').join('')+btn('Ver mapa comercial',"change('Mapa')",'primary')+'</div></div>'}
if(page==='Mapa'){h+='<div class="card"><div class="actions"><select onchange="channel=this.value;draw()"><option '+(channel==='Todos'?'selected':'')+'>Todos</option><option '+(channel==='Almacenero'?'selected':'')+'>Almacenero</option><option '+(channel==='Gastronómico'?'selected':'')+'>Gastronómico</option></select><select onchange="state=this.value;draw()"><option>Todos</option><option '+(state==='Verde'?'selected':'')+'>Verde</option><option '+(state==='Amarillo'?'selected':'')+'>Amarillo</option><option '+(state==='Rojo'?'selected':'')+'>Rojo</option></select></div><h2>San Rafael · Mapa esquemático</h2><div class="map">'+clients.filter(c=>(channel==='Todos'||c.c===channel)&&(state==='Todos'||c.s===state)).map((c,i)=>'<button title="'+c.n+'" class="pin '+(c.s==='Rojo'?'red':c.s==='Amarillo'?'yellow':'')+'" style="left:'+(15+i*20)+'%;top:'+(18+(i%3)*22)+'%" onclick="alert(\''+c.n+' · '+c.mix+'\')"></button>').join('')+'</div><p>🟢 Al día · 🟡 Revisar · 🔴 Crítico. Los colores representan situación económica, no vendedores.</p></div>'}
if(page==='Clientes'){h+=clients.map((c,i)=>'<div class="card"><div class="line"><b>'+c.n+'</b><span class="tag '+(c.s==='Rojo'?'red':c.s==='Verde'?'green':'')+'">'+c.s+'</span></div><p>'+c.c+' · '+c.mix+'</p><div class="actions">'+btn('✓ Visitado',"visits++;alert('Visita registrada');draw()",'primary')+btn('No visitado',"alert('Marcado como no visitado')")+btn('🎙 Nota de voz',"alert('En la versión real solicitará permiso de micrófono. No se graba en esta demo.')")+'</div></div>').join('')}
if(page==='Pedidos'){h+='<div class="card"><h2>Simulador de pedido</h2><p>Cliente: Restaurante Los Olivos</p><div class="line">Queso · 5 hormas <b>$125.000</b></div><div class="line">Descuento autorizado <select onchange="discount=+this.value;draw()">'+[0,5,10,15,20].map(v=>'<option value="'+v+'" '+(discount===v?'selected':'')+'>'+v+'%</option>').join('')+'</select></div><div class="line">Total simulado <b>$'+(125000*(1-discount/100)).toLocaleString('es-AR')+'</b></div>'+btn('Enviar pedido',"order++;status='Registrado';draw()",'primary')+'</div><div class="card"><h2>Pedido '+(order?'#SIM-'+order:'sin registrar')+'</h2><p>Estado: '+status+'</p>'+btn('Ver en depósito',"change('Depósito')")+'</div>'}
if(page==='Depósito'){h+='<div class="card"><h2>Preparación de mercadería</h2><p>Pedido '+(order?'#SIM-'+order:'de ejemplo')+' · '+status+'</p><div class="line">🧀 Queso · 5 hormas</div><div class="actions">'+btn('Preparado',"status='Preparado';draw()",'primary')+btn('Controlado',"status='Controlado';draw()")+btn('Despachado',"status='Despachado';draw()")+btn('Ir a entregas',"change('Entregas')")+'</div></div>'}
if(page==='Entregas'){h+='<div class="card"><h2>Ruta de reparto · San Rafael</h2><p>Pedido '+(order?'#SIM-'+order:'de ejemplo')+' · '+status+'</p><p>⚠ Verificar condiciones de cobranza antes de entregar.</p><div class="actions">'+btn('✓ Entregado',"status='Entregado';delivered++;draw()",'primary')+btn('Entrega parcial',"status='Parcial';draw()")+btn('No entregado',"status='No entregado';draw()")+btn('Cobranza recibida',"alert('Cobranza simulada registrada')")+'</div><p>Entregas confirmadas: '+delivered+'</p></div>'}
if(page==='Configuración'){h+='<div class="card"><h2>Modalidad GPS</h2><p>Seleccioná una opción para la empresa</p><select onchange="gps=this.value;draw()"><option '+(gps==='Sin GPS'?'selected':'')+'>Sin GPS</option><option '+(gps==='Puntual'?'selected':'')+'>Puntual</option><option '+(gps==='Flota'?'selected':'')+'>Flota</option></select><p>Seleccionado: '+gps+'. La ubicación no se registra realmente.</p></div>'}
if(page==='Asistente IA'){h+='<div class="card"><h2>Asistente comercial · Simulación</h2><p>Restaurante Los Olivos compra fiambre, pero no manteca. Sugerencia: consultar si es por precio, necesidad o falta de oferta.</p>'+btn('Generar recomendación',"alert('Recomendación simulada: ofrecer manteca y registrar la respuesta del cliente.')",'primary')+'</div>'}
if(['Agenda','Rutas','Equipo','Cobranzas'].includes(page)){h+='<div class="card"><h2>'+page+'</h2><p>Vista de demostración: clientes asignados, tareas y alertas comerciales.</p>'+btn('Registrar visita',"visits++;draw()",'primary')+btn('Consultar clientes',"change('Clientes')")+'</div>'}
document.getElementById('app').innerHTML=h}draw();
</script></body></html>
